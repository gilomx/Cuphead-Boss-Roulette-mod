<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batalla Molestosa</title>
  <link rel="stylesheet" href="/pesky-battle-overlay.css?v=battle-title-gap-19">
</head>
<body>
  <main
    id="battle"
    class="battle"
    data-visible="false"
    aria-hidden="true"
    data-phase="off"
    data-variant="default"
    data-show-title="true"
    data-show-details="true"
    data-motion="true"
  >
    <header class="battle__header">
      <strong id="battle-status" class="battle__status" role="status" aria-live="polite"></strong>
    </header>

    <div class="battle__roster-area">
      <ol id="battle-roster" class="battle__roster" aria-label="Participantes de Batalla Molestosa"></ol>
    </div>
  </main>

  <template id="battle-slot-template">
    <li class="battle-slot" data-filled="false">
      <div class="battle-slot__portrait">
        <img class="battle-slot__avatar" alt="" referrerpolicy="no-referrer" hidden>
        <img class="battle-slot__gift" alt="" hidden>
        <span class="battle-slot__coin" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17" fill="#f4c76f" stroke="#c39032" stroke-width="2" />
          <circle cx="20" cy="20" r="12" fill="none" stroke="#ffe8a8" stroke-width="2" />
          <path d="m20 11 6 9-6 9-6-9z" fill="#c39032" />
        </svg>
        </span>
        <span class="battle-slot__initial" aria-hidden="true" hidden></span>
      </div>
      <span class="battle-slot__name" hidden></span>
      <span class="battle-slot__attack" role="status">
        <span class="battle-slot__attack-visual">
          <img class="battle-slot__attack-image" alt="">
        </span>
      </span>
      <span class="battle-slot__challenge" role="status" aria-hidden="true">
        <span class="battle-slot__challenge-visual">
          <img class="battle-slot__challenge-image" alt="">
        </span>
      </span>
    </li>
  </template>

  <script src="/assets/creator-tools/live-event-overlay-runtime.js?v=composer-1"></script>
  <script src="/assets/creator-tools/overlay-interactions.js?v=game-signals-9"></script>
  <script src="/pesky-battle-overlay.js?v=battle-title-gap-19"></script>
</body>
</html>
