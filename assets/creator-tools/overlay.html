<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El overlay de Ruleta cambió de lugar</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;font-family:"Segoe UI",sans-serif;color:#fff}
body{display:grid;place-items:center}main{max-width:660px;margin:24px;padding:28px 34px;border:2px solid #d3af93;border-radius:18px;background:#241b2bee;box-shadow:0 8px 32px #0004}
h1{font-size:28px;margin:0 0 14px}p{font-size:20px;line-height:1.5;margin:12px 0}a{color:#f4c95d}small{display:block;line-height:1.5;font-size:16px}
</style></head><body><main><h1 id="title">El overlay de Ruleta cambió de lugar</h1>
<p id="steps">Abre el panel → Overlays → Ruleta. Configura tu perfil y copia la nueva URL para reemplazar esta fuente en OBS.</p>
<p><a id="link" href="/config/overlay-designer?component=roulette">Abrir diseñador de overlays</a></p>
<small id="note">Tus ajustes anteriores se conservan. Este aviso desaparecerá cuando actualices la URL de la fuente.</small></main>
<script>if(new URLSearchParams(location.search).get('locale')==='en'){document.documentElement.lang='en';document.getElementById('title').textContent='The Roulette overlay has moved';document.getElementById('steps').textContent='Open the panel → Overlays → Roulette. Configure your profile and copy its new URL to replace this browser source in OBS.';document.getElementById('link').textContent='Open overlay designer';document.getElementById('link').href+='&locale=en';document.getElementById('note').textContent='Your previous settings are preserved. This notice disappears after updating the source URL.'}</script></body></html>
